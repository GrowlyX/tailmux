[package]
name = "tailmux-desktop"
version = "0.0.0"
description = "tailmux tray app for Windows and Linux"
license = "BSD-3-Clause"
edition = "2021"
rust-version = "1.77"

[lib]
name = "tailmux_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Blocking client: every call runs on a worker thread, and it never
# picks up a system proxy, so the loopback API stays local.
ureq = { version = "3", features = ["json"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-autostart = "2"
tauri-plugin-positioner = { version = "2", features = ["tray-icon"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
