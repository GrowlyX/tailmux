name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: go mod tidy is clean
        run: go mod tidy && git diff --exit-code go.mod go.sum
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0
      - name: golangci-lint (darwin)
        run: GOOS=darwin golangci-lint run ./...
      - name: builds for every GOOS we claim
        run: |
          for os in linux darwin windows freebsd; do GOOS=$os go build ./... ; done
      - uses: golang/govulncheck-action@v1
        with:
          go-version-file: go.mod

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # Each package runs its own set of in-process tailnets; one package at
      # a time keeps small runners from starving WireGuard handshakes. The
      # race detector's ~10x slowdown only fits on the Linux runners.
      - name: unit + end-to-end (three in-process tailnets)
        run: |
          race=""
          if [ "$RUNNER_OS" = Linux ]; then race=-race; fi
          go test $race -p 1 -count=1 -timeout 20m ./...

  # Proxy-free mode against the real OS: a TUN device, kernel routes and
  # the system resolver (systemd-resolved on Linux, /etc/resolver on macOS).
  tun-e2e:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go test -c -o tun.test ./internal/tun
      - name: TestSystem as root
        if: runner.os != 'Windows'
        run: sudo TAILMUX_TUN_E2E=1 TAILMUX_TUN_E2E_REQUIRE_DNS=1 ./tun.test -test.run TestSystem -test.v -test.timeout 10m
      - name: TestSystem as Administrator (Wintun, NRPT)
        if: runner.os == 'Windows'
        run: |
          scripts/fetch-wintun.sh .
          mv tun.test tun.test.exe
          TAILMUX_TUN_E2E=1 TAILMUX_TUN_E2E_REQUIRE_DNS=1 ./tun.test.exe -test.run TestSystem -test.v -test.timeout 10m
      - name: nothing left behind
        if: always()
        run: |
          if [ "$RUNNER_OS" = macOS ] && grep -rl "managed by tailmux" /etc/resolver 2>/dev/null; then exit 1; fi
          if [ "$RUNNER_OS" = Linux ] && ip link show tailmux0 2>/dev/null; then exit 1; fi
          if [ "$RUNNER_OS" = Windows ] && reg query 'HKLM\SYSTEM\CurrentControlSet\Services\Dnscache\Parameters\DnsPolicyConfig' 2>/dev/null | grep -i tailmux; then exit 1; fi

  # `tailmux service install` for real: systemd on Linux, the service
  # manager on Windows. The service must come up, answer on its API with
  # the starter config's tailnets, run TUN mode, and uninstall cleanly.
  service:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: build
        run: |
          mkdir -p out
          ext=""
          if [ "$RUNNER_OS" = Windows ]; then ext=.exe; fi
          go build -ldflags "-X main.version=0.0.0-ci" -o "out/tailmux$ext" ./cmd/tailmux
          if [ "$RUNNER_OS" = Windows ]; then scripts/fetch-wintun.sh out; fi
      - name: install
        run: |
          if [ "$RUNNER_OS" = Windows ]; then out/tailmux.exe service install; else sudo out/tailmux service install; fi
      - name: running, answering, in TUN mode
        run: |
          # The API answers before TUN is up; wait for the interface.
          for _ in $(seq 1 90); do
            curl -sf http://127.0.0.1:1056/status > status.json && grep -q '"interface"' status.json && break
            sleep 1
          done
          cat status.json
          for n in work home lab; do grep -q "\"name\": \"$n\"" status.json || { echo "tailnet $n missing"; exit 1; }; done
          grep -q '"interface"' status.json || { echo "TUN mode is not up"; exit 1; }
          if [ "$RUNNER_OS" = Windows ]; then out/tailmux.exe service status; else out/tailmux service status; fi
      - name: service log
        if: failure()
        run: curl -sf "http://127.0.0.1:1056/logs?n=200" | tr ',' '\n' | tail -80 || true
      - name: uninstall
        if: always()
        run: |
          if [ "$RUNNER_OS" = Windows ]; then out/tailmux.exe service uninstall; else sudo out/tailmux service uninstall; fi
          if curl -sf --max-time 3 http://127.0.0.1:1056/status; then echo "still running after uninstall"; exit 1; fi

  # The Windows/Linux desktop app: real installers, its API tests and
  # screenshots against a live daemon, and a screenshot of the real app.
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      APPIMAGE_EXTRACT_AND_RUN: 1 # no FUSE on the runners
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: pnpm/action-setup@v6
        with:
          version: 11
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: pnpm
          cache-dependency-path: desktop/pnpm-lock.yaml
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
      - name: Linux build deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libxdo-dev build-essential xvfb imagemagick
      - name: service binary as the sidecar
        run: |
          triple=$(rustc -vV | sed -n 's/^host: //p')
          ext=""
          if [ "$RUNNER_OS" = Windows ]; then ext=.exe; scripts/fetch-wintun.sh desktop/src-tauri/binaries; fi
          go build -ldflags "-X main.version=0.0.0-ci" -o "desktop/src-tauri/binaries/tailmux-$triple$ext" ./cmd/tailmux
          cp "desktop/src-tauri/binaries/tailmux-$triple$ext" "tailmux$ext"
      - name: check and bundle
        working-directory: desktop
        run: |
          pnpm install --frozen-lockfile
          pnpm check
          if [ "$RUNNER_OS" = Windows ]; then pnpm tauri build --bundles nsis,msi; else pnpm tauri build --bundles deb,appimage; fi
      - name: start lab tailnets and daemon
        run: |
          TAILMUX_LAB="$PWD/lab.json" go test ./internal/mux -run TestLab -timeout 0 > lab.log 2>&1 &
          for _ in $(seq 1 120); do [ -f lab.json.ready ] && break; sleep 2; done
          ./tailmux up -config lab.json > up.log 2>&1 &
          for _ in $(seq 1 60); do curl -sf http://127.0.0.1:21056/status && break; sleep 1; done
          for n in alpha bravo charlie; do curl -sf --socks5-hostname 127.0.0.1:21055 "http://web.$n/?bytes=3000000" > /dev/null; done
          # Keep traffic flowing so the charts in the screenshots have lines.
          (
            for i in $(seq 1 900); do
              for n in alpha bravo charlie; do
                curl -s --socks5-hostname 127.0.0.1:21055 "http://web.$n/?bytes=$(( (i % 5 + 1) * 150000 ))" > /dev/null &
              done
              sleep 1
            done
          ) &
      - name: app API tests against the daemon
        working-directory: desktop/src-tauri
        env:
          TAILMUX_API: http://127.0.0.1:21056
        # Own target dir: a plain cargo build of the release binary would
        # replace the bundled one (built with the frontend embedded) with a
        # dev build that loads localhost:1420.
        run: cargo test --release --test api --target-dir target/api-tests
      - name: screenshots of every view
        working-directory: desktop
        env:
          TAILMUX_API: http://127.0.0.1:21056
        run: |
          pnpm exec playwright install --with-deps chromium
          pnpm screenshot --out ../shots
      - name: screenshot of the real app (Linux)
        if: runner.os == 'Linux'
        env:
          TAILMUX_API: http://127.0.0.1:21056
        run: |
          xvfb-run -a -s "-screen 0 1280x800x24" dbus-run-session -- \
            scripts/ci-app-screenshot-linux.sh desktop/src-tauri/target/release/tailmux-desktop shots/native-linux.png
      - name: screenshot of the real app (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          TAILMUX_API: http://127.0.0.1:21056
        run: |
          Start-Process desktop/src-tauri/target/release/tailmux-desktop.exe -ArgumentList '--page','overview'
          Start-Sleep 12
          Add-Type -AssemblyName System.Windows.Forms,System.Drawing
          $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $img = New-Object System.Drawing.Bitmap $b.Width, $b.Height
          [System.Drawing.Graphics]::FromImage($img).CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
          $img.Save("$PWD/shots/native-windows.png")
          Stop-Process -Name tailmux-desktop -ErrorAction SilentlyContinue
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: desktop-${{ runner.os }}
          path: |
            shots/
            *.log
            desktop/src-tauri/target/release/bundle/deb/*.deb
            desktop/src-tauri/target/release/bundle/appimage/*.AppImage
            desktop/src-tauri/target/release/bundle/nsis/*.exe
            desktop/src-tauri/target/release/bundle/msi/*.msi

  # The menu bar app, built and rendered against a live daemon.
  menubar:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: build app
        run: macos/build-app.sh "$PWD/dist" ci
      - name: start lab tailnets and daemon
        run: |
          go build -o tailmux ./cmd/tailmux
          TAILMUX_LAB="$PWD/lab.json" go test ./internal/mux -run TestLab -timeout 0 > lab.log 2>&1 &
          for _ in $(seq 1 90); do [ -f lab.json.ready ] && break; sleep 2; done
          ./tailmux up -config lab.json > up.log 2>&1 &
          for _ in $(seq 1 30); do curl -sf http://127.0.0.1:21056/status && break; sleep 1; done
          for n in alpha bravo charlie; do curl -sf --socks5-hostname 127.0.0.1:21055 "http://web.$n/?bytes=2000000" > /dev/null; done
      - name: render panel
        run: |
          out=$(TAILMUX_API=http://127.0.0.1:21056 dist/TailmuxBar.app/Contents/MacOS/TailmuxBar --snapshot panel.png --wait 3)
          echo "$out"
          echo "$out" | grep -q "3 tailnets, offline: no"
          TAILMUX_API=http://127.0.0.1:21056 dist/TailmuxBar.app/Contents/MacOS/TailmuxBar --snapshot panel-dark.png --dark
          for page in overview tailnets devices settings logs; do
            TAILMUX_API=http://127.0.0.1:21056 dist/TailmuxBar.app/Contents/MacOS/TailmuxBar --snapshot "window-$page.png" --page "$page" --dark
          done
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: menubar-snapshots
          path: |
            panel*.png
            window-*.png
            *.log

  # Installs the formula from a tarball of this commit, runs `brew test`
  # and `brew audit`, exactly as a user's `brew install` would.
  homebrew:
    runs-on: macos-latest
    env:
      HOMEBREW_NO_AUTO_UPDATE: 1
      HOMEBREW_NO_INSTALL_FROM_API: 1
    steps:
      - uses: actions/checkout@v7
      - name: formula for this commit
        run: |
          git archive --format=tar.gz --prefix=tailmux-0.0.0-ci/ -o "$RUNNER_TEMP/tailmux-0.0.0-ci.tar.gz" HEAD
          sha=$(shasum -a 256 "$RUNNER_TEMP/tailmux-0.0.0-ci.tar.gz" | cut -d' ' -f1)
          brew tap-new --no-git ci/local
          tap="$(brew --repository)/Library/Taps/ci/homebrew-local"
          mkdir -p "$tap/Formula"
          scripts/render-formula.sh "file://$RUNNER_TEMP/tailmux-0.0.0-ci.tar.gz" "$sha" > "$tap/Formula/tailmux.rb"
      - run: brew install --build-from-source ci/local/tailmux
      - run: brew test ci/local/tailmux
      - run: brew audit --strict ci/local/tailmux
      - run: tailmux version && test -f "$(brew --prefix)/etc/tailmux/config.json"
