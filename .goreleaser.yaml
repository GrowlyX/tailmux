version: 2
project_name: tailmux

builds:
  - main: ./cmd/tailmux
    env: [CGO_ENABLED=0]
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags: ["-s -w -X main.version={{ .Version }}"]

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files: [README.md, LICENSE]

checksum:
  name_template: checksums.txt

changelog:
  use: github
  sort: asc
  filters:
    exclude: ["^docs:", "^ci:", "^chore\\(deps\\)"]

# Headless packages: just the CLI and daemon, for servers and for people
# who don't want the tray app. The desktop app's .deb/.rpm (built in the
# release workflow) already contain tailmux, hence the conflict.
nfpms:
  - id: cli
    package_name: tailmux-cli
    file_name_template: "{{ .PackageName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    vendor: tailmux
    homepage: https://github.com/GrowlyX/tailmux
    maintainer: Subham K. <me@growly.gg>
    description: Be on all your tailnets at once (CLI and daemon).
    license: BSD-3-Clause
    formats: [deb, rpm, apk, archlinux]
    bindir: /usr/bin
    section: net
    conflicts: [tailmux]
    dependencies: [iproute2]
    overrides:
      deb:
        scripts:
          preremove: desktop/src-tauri/linux/prerm.sh
      rpm:
        dependencies: [iproute]
        scripts:
          preremove: desktop/src-tauri/linux/prerm.sh
    scripts:
      postinstall: packaging/linux/postinstall.sh
